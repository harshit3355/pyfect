name: check setup
description: >
  What ci.yml's lint and test jobs both need: uv, Node, the Effect checkout the oracle tests
  read (at $EFFECT_COMMIT into $PYFECT_EFFECT_REF), and the project synced on one Python.
inputs:
  python:
    description: The Python to sync and check, as in the job's matrix.
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Check out Effect 4.1.2
      shell: bash
      run: |
        git init -q "$PYFECT_EFFECT_REF"
        git -C "$PYFECT_EFFECT_REF" fetch -q --depth 1 https://github.com/Effect-TS/effect.git "$EFFECT_COMMIT"
        git -C "$PYFECT_EFFECT_REF" checkout -q FETCH_HEAD

    - name: Install
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        uv sync --locked --python "$PYTHON"
        uv run python -c "import sys; assert f'{sys.version_info.major}.{sys.version_info.minor}' == '$PYTHON', sys.version"
